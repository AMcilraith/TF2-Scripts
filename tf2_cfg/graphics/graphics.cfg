// ====================================================
// TF2 GRAPHICS & CLIENT EFFECTS CONFIGURATION
// Visual and sound feedback settings
// ====================================================

// -----------------------------
// Sprays & Decals
// -----------------------------
cl_spraydisable 0
cl_customsounds 1
r_spray_lifetime 2
r_decals 400
r_decal_cullsize 1
r_decalstaticprops 1
r_drawmodeldecals 1
r_drawbatchdecals 1
mp_decals 4000
cl_allowdownload 1
cl_allowupload 1
tf_delete_temp_files 0

// -----------------------------
// HUD & Effects
// -----------------------------
crosshair 1
cl_crosshair_red 236
cl_crosshair_green 236
cl_crosshair_blue 203
cl_crosshair_scale 20

hud_medichealtargetmarker 1
cl_new_impact_effects 1
cl_hud_playerclass_use_playermodel 1

// -----------------------------
// Graphics Configuration
// -----------------------------
//exec graphics/graphics_ultra
exec graphics/graphics_normal  
//exec graphics/graphics_comp
//exec graphics/graphics_maxfps
//exec graphics/graphics_laptop

// -----------------------------
// Sound Configuration
// -----------------------------
exec sound/sound
custom_snd_ultra

// -----------------------------
// Anti-Crash Configuration
// -----------------------------
mat_filterlightmaps 0
mat_filtertextures 1
mat_specular 1
mat_phong 1
mat_bumpmap 1
cl_always_flush_models 1
mod_load_anims_async 0
mod_load_mesh_async 0
mod_load_vcollide_async 0
// Single-threaded rendering (1 = stable; -1 = multi-thread can crash)
mat_queue_mode 1
mat_forcehardwaresync 0
mat_levelflush 1
r_threaded_particles 0
// Safer sound (async can cause freezes/crashes on some systems)
snd_async_fullyasync 0
snd_mix_async 0
// Disable threaded packet to avoid rare network-thread crashes
net_queued_packet_thread 0
// Re-apply decal limit so presets don't raise it (reduces GPU hitches)
r_decals 400

// -----------------------------
// Console Echo
// -----------------------------
echo "====================================================="
echo " Core Graphics Config Loaded"
echo "====================================================="